<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة التفاعلية لإنجازات جامعة قنا 2023 - 2026</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            width: 120px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .header-title {
            text-align: center;
            flex-grow: 1;
            padding: 0 20px;
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .nav-container {
            text-align: center;
            margin: 25px 0;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .map-btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .map-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
        }

        .video-info {
            padding: 15px 20px;
        }

        .video-info h3 {
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .featured-video {
            margin-bottom: 30px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- شعار جامعة قنا -->
        <div class="logo-container">
            <img src="Image/logo.png" alt="شعار جامعة قنا" onerror="this.src='image/logo.png';">
        </div>

        <!-- العنوان -->
        <div class="header-title">
            <h1>الخريطة التفاعلية لإنجازات جامعة قنا 2023 - 2026</h1>
        </div>

        <div class="logo-container">
            <img src="Image/مسيرة.png" alt="شعار مسيرة" onerror="this.src='Image/مسيرة.jpg';">
        </div>
    </header>

    <!-- زر الخريطة التفاعلية -->
    <div class="nav-container">
        <a href="Map.html" class="map-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            الخريطة التفاعلية
        </a>
    </div>

    <main>
        <!-- الفيديو الرئيسي -->
        <section class="featured-video">
            <div class="video-card">
                <div class="video-wrapper">
                    <video id="mainVideo" controls autoplay muted playsinline>
                        <source src="Video/video1.mp4" type="video/mp4">
                        <source src="video/video1.mp4" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                </div>
                <div class="video-info">
                    <h3>فيديو افتتاحي: إنجازات جامعة قنا</h3>
                </div>
            </div>
        </section>

        <!-- شبكة الفيديوهات -->
        <section class="video-grid">
            <div class="video-card">
                <div class="video-wrapper">
                    <video controls>
                        <source src="Video/video2.mp4" type="video/mp4">
                        <source src="video/video2.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-info">
                    <h3>المشاريع القومية والتعليمية</h3>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <video controls>
                        <source src="Video/video3.mp4" type="video/mp4">
                        <source src="video/video3.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-info">
                    <h3>الخدمات المجتمعية والطبية</h3>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <video controls>
                        <source src="Video/video4.mp4" type="video/mp4">
                        <source src="video/video4.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-info">
                    <h3>التحول الرقمي والحوكمة</h3>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <video controls>
                        <source src="Video/video5.mp4" type="video/mp4">
                        <source src="video/video5.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-info">
                    <h3>الأنشطة الطلابية والبحث العلمي</h3>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mainVideo = document.getElementById('mainVideo');

            if (mainVideo) {
                mainVideo.play().catch(error => {
                    console.log('التشغيل التلقائي يتطلب الميوت:', error);
                });
            }

            const allVideos = document.querySelectorAll('video');
            allVideos.forEach(video => {
                video.addEventListener('play', () => {
                    allVideos.forEach(otherVideo => {
                        if (otherVideo !== video) {
                            otherVideo.pause();
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
